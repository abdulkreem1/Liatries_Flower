version: '3.8'

services:
  db:
    image: postgres:15
    container_name: liatries_postgres
    environment:
      POSTGRES_DB: liatries_db
      POSTGRES_USER: liatries_user
      POSTGRES_PASSWORD: liatries_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    build: ./backend
    container_name: liatries_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_NAME=liatries_db
      - DB_USER=liatries_user
      - DB_PASSWORD=liatries_password
      - DB_PORT=5432

volumes:
  postgres_data: